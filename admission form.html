<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>admission form</title>
</head>
<body>
    <h2>Admission Form</h2>
    <form>
        <label>Name:</label>
        <input type="text" name="name" id="name" required> <br>


        <input type="radio" id="male" name="Gender" value="Male">
        <label>Male</label>
         <input type="radio" id="Femmale" name="Gender" value="Female">
         <label>Female</label><br><br>


         <input type="checkbox" id="class 9" name="class 9" value="first">
         <label>class 9</label>
        <input type="checkbox" id="class 10" name="class 10" value="second">
         <label>class 10</label>
         <input type="checkbox" id="other" name="other" value="first">
         <label>Other</label> <br>

         <label>Phone Number</label>
         <input type="tel" name="phone" id="phone" required> <br>

         <label>DOB</label>
         <input type="date">



         <p>Address</p>
         <textarea name="reason" id="reason" rows="5" cols="30" placeholder="describe your reason and address**"></textarea> <br>
         

         <input type="submit" value="Submit">
    </form>
    
</body>
</html>
